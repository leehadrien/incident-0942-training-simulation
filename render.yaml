databases:
  - name: incident-0942-db
    plan: free
    databaseName: incident_0942
    user: incident_0942

services:
  - type: web
    name: incident-0942-training
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: incident-0942-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://hadrienlee.com
